name: Build IDE plugin
# Builds the Android Studio plugin and publishes it (plus the skill .plugin and the CLI jar) as release assets.
on:
  push:
    branches: [main]
    paths: ["ide-plugin/**", "skills/**", ".github/workflows/build-ide-plugin.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: ide-plugin
        run: chmod +x gradlew && ./gradlew buildPlugin --no-daemon
      - name: Package skill (.plugin)
        run: |
          mkdir -p dist
          cp ide-plugin/build/distributions/android-design-audit-*.zip dist/android-design-audit-ide.zip
          cp skills/android-design-audit/bin/audit-core.jar dist/audit-core.jar
          zip -r dist/android-design-audit.plugin .claude-plugin README.md skills -x "*__pycache__*" -x "*.DS_Store"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-design-audit-build
          path: dist/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Update the rolling "latest" pre-release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          files: dist/*
          body: "Automatically built from the latest commit on main. Use a versioned release for stable installs."
